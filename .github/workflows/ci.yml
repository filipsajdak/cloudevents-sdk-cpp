name: ci

# The build matrix. It depends on the spec gate: a requirement that does not lint,
# does not trace, or whose evidence does not resolve blocks the build rather than
# merging alongside it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: requirements gate
    uses: ./.github/workflows/spec.yml

  floor:
    name: ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The toolchain floor from SPEC section 8. These are the versions the
          # SDK claims to support, so they are the ones that must be proven; the
          # newer local compilers prove nothing about the floor.
          # GCC 13 is the floor because libstdc++ 13 is the first with <format>.
          - { name: "gcc-13 c++20",   os: ubuntu-24.04, cxx: g++-13,     std: 20, apt: g++-13, flags: "" }
          - { name: "gcc-13 c++23",   os: ubuntu-24.04, cxx: g++-13,     std: 23, apt: g++-13, flags: "" }
          # Clang 16 stays in the floor, but only against a library that has
          # <format>. The same compiler on 22.04 (libstdc++ 12) would not build the
          # SDK, which is the point of the #error in detail/config.hpp.
          #
          # It is pinned to libstdc++ 13, the floor SPEC section 8 names;
          # ubuntu-24.04 would otherwise default it to 14.
          - { name: "clang-16 c++20", os: ubuntu-24.04, cxx: clang++-16, std: 20, apt: "clang-16 g++-13", flags: "--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/13" }
          # Clang at C++23 is proven against libc++, the other library floor SPEC
          # section 8 names. Clang 16 cannot compile libstdc++ 13 or 14 in C++23
          # mode at all - their <ranges> uses what clang 16 does not have - so
          # that pairing is untestable rather than merely untested.
          #
          # libc++ 17 is the floor, and it is the version that exercises the
          # carve-out in detail/config.hpp: it has a working std::format and no
          # __cpp_lib_format. Testing a newer libc++ would leave that path unrun.
          - { name: "clang-17 libc++ c++23", os: ubuntu-24.04, cxx: clang++-17, std: 23, apt: "clang-17 libc++-17-dev libc++abi-17-dev", flags: "-stdlib=libc++" }
          - { name: "appleclang c++20", os: macos-15,   cxx: clang++,    std: 20, apt: "", flags: "" }
          - { name: "appleclang c++23", os: macos-15,   cxx: clang++,    std: 23, apt: "", flags: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }} ninja-build
      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCMAKE_CXX_FLAGS=${{ matrix.flags }}
          -DCE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  msvc:
    name: msvc c++20
    needs: gate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_STANDARD=20 -DCE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  polyfill:
    # ADR-0002. Building the whole suite against the result<T> polyfill on a
    # compiler that HAS std::expected is what enforces the permitted subset: any
    # use of a banned member is a hard compile error here. Removing this job
    # removes the only thing standing between the codebase and a .value() call
    # that breaks the -fno-exceptions guarantee.
    name: forced result<T> polyfill
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_STANDARD=23
          -DCE_WERROR=ON -DCMAKE_CXX_FLAGS=-DCE_FORCE_RESULT_POLYFILL=1
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  no-exceptions:
    name: exceptions disabled
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_STANDARD=20
          -DCE_WERROR=ON -DCMAKE_CXX_FLAGS=-fno-exceptions
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  no-default-codec:
    # SWR-ADOPT-0002 / SWR-JSON-0030: with the codec off, nothing may pull in
    # nlohmann. The build failing to find it is the point.
    name: without the default codec
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_STANDARD=20
          -DCE_WERROR=ON -DCE_DEFAULT_CODEC=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  no-codecs-plural:
    # The same end state as no-default-codec, reached the other way through
    # CeCodecs.cmake: that job subtracts nlohmann from the list, this one never
    # puts anything in it. Both spellings are supported, so both are run.
    name: the plural spelling of no codecs
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_STANDARD=20
          -DCE_WERROR=ON "-DCE_CODECS="
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  install-consumer:
    # SWR-ADOPT-0004: install the package, then find_package it from a separate
    # project that names no include path of its own.
    name: install and consume
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" -DCE_BUILD_TESTING=OFF
          cmake --build build --target install
      - name: Consume the installed package
        run: |
          cmake -S test/consumer -B build-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure

      # The case above cannot see a packaging defect this one can: it always
      # finds an nlohmann, either the system copy or the one FetchContent stages
      # beside the SDK. A distribution ships neither, and its users may not have
      # nlohmann at all. ce::core depends on CTRE alone (SWR-ADOPT-0002), so
      # that consumer must still be able to use the package.
      #
      # Installing the system package does not produce that arrangement - it is
      # older than the 3.12.0 the SDK asks for, so FetchContent stages a copy
      # anyway. The stage is stripped instead, which is exactly what a distro
      # package that does not vendor its dependency looks like.
      - name: Install to a second prefix and strip nlohmann from it
        run: |
          rm -rf build stage-system
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage-system" -DCE_BUILD_TESTING=OFF
          cmake --build build --target install
          find stage-system -depth -name 'nlohmann*' -exec rm -rf {} +
          test -z "$(find stage-system -name 'nlohmann*' -print -quit)" \
            || { echo "nlohmann survived the strip"; exit 1; }
          echo "stage-system carries no nlohmann"

      - name: The package works without nlohmann, and says the codec is absent
        run: |
          mkdir -p /tmp/probe-core
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.25)' \
            'project(probe_core LANGUAGES CXX)' \
            'find_package(cloudevents REQUIRED)' \
            'if(cloudevents_codec_nlohmann_FOUND)' \
            '  message(FATAL_ERROR "nlohmann was not hidden; this check proves nothing")' \
            'endif()' \
            'foreach(t ce::core ce::format_json ce::binding_http)' \
            '  if(NOT TARGET ${t})' \
            '    message(FATAL_ERROR "${t} is missing without nlohmann")' \
            '  endif()' \
            'endforeach()' \
            > /tmp/probe-core/CMakeLists.txt
          cmake -S /tmp/probe-core -B /tmp/probe-core-build \
            -DCMAKE_PREFIX_PATH="$PWD/stage-system" \
            -DCMAKE_IGNORE_PREFIX_PATH="/usr;/usr/local"

      - name: Asking for the codec component without nlohmann fails cleanly
        run: |
          mkdir -p /tmp/component-probe
          printf '%s\n' \
            'cmake_minimum_required(VERSION 3.25)' \
            'project(component_probe LANGUAGES CXX)' \
            'find_package(cloudevents REQUIRED COMPONENTS codec_nlohmann)' \
            > /tmp/component-probe/CMakeLists.txt
          if cmake -S /tmp/component-probe -B /tmp/component-build \
               -DCMAKE_PREFIX_PATH="$PWD/stage-system" \
               -DCMAKE_IGNORE_PREFIX_PATH="/usr;/usr/local" > /tmp/probe.log 2>&1; then
            echo "requesting codec_nlohmann without nlohmann should have failed"
            exit 1
          fi
          if ! grep -q "requires nlohmann_json" /tmp/probe.log; then
            echo "the failure did not explain why; message was:"
            cat /tmp/probe.log
            exit 1
          fi
          echo "failed with the expected explanation"

      - name: The real consumer builds against that prefix too
        run: |
          cmake -S test/consumer -B build-nonlohmann -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_PREFIX_PATH="$PWD/stage-system" \
            -DCMAKE_IGNORE_PREFIX_PATH="/usr;/usr/local"
          cmake --build build-nonlohmann
          ctest --test-dir build-nonlohmann --output-on-failure

  reflection:
    # SPEC section 3 rule 6 wants early warning from a newer toolchain. GCC's
    # reflection is explicitly experimental and __cpp_impl_reflection tracks a
    # moving paper, so this job is allowed to fail: it surfaces breakage without
    # blocking a release on a feature nobody's floor depends on.
    name: c++26 static reflection (allowed to fail)
    needs: gate
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install a reflection-capable GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-15 || sudo apt-get install -y ninja-build g++-14
      - name: Probe for reflection support
        id: probe
        run: |
          CXX=$(command -v g++-15 || command -v g++-14)
          echo "cxx=$CXX" >> "$GITHUB_OUTPUT"
          if printf 'int main(){}' | $CXX -std=c++2c -freflection -fsyntax-only -x c++ - 2>/dev/null; then
            echo "supported=yes" >> "$GITHUB_OUTPUT"
          else
            echo "supported=no" >> "$GITHUB_OUTPUT"
            echo "::warning::This runner's GCC does not implement -freflection; the C++26 backend was not compiled here."
          fi
      - name: Configure and build
        if: steps.probe.outputs.supported == 'yes'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ steps.probe.outputs.cxx }} \
            -DCMAKE_CXX_FLAGS="-std=c++2c -freflection" -DCE_WERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  sanitizers:
    name: asan + ubsan
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 libc++-17-dev libc++abi-17-dev ninja-build \
            nlohmann-json3-dev
      # SWR-SEC-0002. -fno-sanitize-recover=all is what makes a report fail the
      # job: without it a finding is counted and the process still exits zero.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-17
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCE_BUILD_EXAMPLES=ON
          -DCE_WERROR=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build
      - name: asan-ubsan-suite
        run: cmake --build build --target asan-ubsan-suite

  coverage:
    name: coverage floor
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build gcovr nlohmann-json3-dev
      # SWR-SEC-0007. The floor is enforced by gcovr's exit code, not printed
      # for someone to read, and the examples are built so their lines count.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_BUILD_TYPE=Debug
          -DCE_BUILD_EXAMPLES=ON
          -DCE_GCOV_EXECUTABLE=gcov-13
          "-DCMAKE_CXX_FLAGS=--coverage -fprofile-update=atomic -O0 -g"
          "-DCMAKE_EXE_LINKER_FLAGS=--coverage"
      - name: Build
        run: cmake --build build
      - name: coverage-report
        run: cmake --build build --target coverage-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/coverage/

  fuzz:
    name: fuzz, ten minutes per target
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 ninja-build nlohmann-json3-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-17
          -DCMAKE_CXX_STANDARD=20
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCE_BUILD_FUZZERS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build
      # SWR-SEC-0001 requires a ten-minute clean run per target. The scratch
      # directory is named FIRST because libFuzzer writes what it discovers into
      # the first corpus directory, and pointing it at the seeds would bury them.
      - name: Run each target for ten minutes
        run: |
          set -e
          mkdir -p /tmp/found
          for target in fuzz_timestamp fuzz_base64 fuzz_json_decode fuzz_http_message fuzz_typed; do
            case "$target" in
              fuzz_timestamp) seeds=timestamp ;;
              fuzz_base64) seeds=base64 ;;
              fuzz_json_decode) seeds=json ;;
              fuzz_http_message) seeds=http ;;
              fuzz_typed) seeds=typed ;;
            esac
            echo "::group::$target"
            mkdir -p "/tmp/found/$target"
            ./build/fuzz/$target "/tmp/found/$target" "fuzz/corpus/$seeds" \
              -max_total_time=600 -timeout=25 -rss_limit_mb=4096 \
              -print_final_stats=1 -artifact_prefix=/tmp/found/$target/
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: /tmp/found/

  examples:
    name: examples build and run
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build nlohmann-json3-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_CXX_STANDARD=20
          -DCE_BUILD_EXAMPLES=ON
          -DCE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Run them
        run: ctest --test-dir build -L example --output-on-failure

  interop:
    name: interop with the Go and Java SDKs
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 cmake ninja-build nlohmann-json3-dev
      # Verify only: the committed goldens must not move in a pull request. Both
      # SDKs read the documents this one produced, and the job fails if either
      # rejects one (SWR-SEC-0005).
      - name: Verify both directions
        run: CXX=g++-13 ./interop/run.sh verify
      - name: The committed goldens are unchanged
        run: git diff --exit-code test/fixtures/interop

  docs:
    name: API reference
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      # SPEC section 10 requires a one-line brief on every public symbol, so the
      # Doxyfile treats a warning as an error and this job is what enforces it.
      # Without the job the setting was inert, and it was: the first run found a
      # doc comment containing the two characters that end a C comment.
      - name: Build the reference
        run: cd docs && doxygen Doxyfile
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: docs/doxygen/html/

  all-codecs:
    name: every codec, ${{ matrix.os }} c++${{ matrix.std }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        std: [20, 23]
    steps:
      - uses: actions/checkout@v4
      - name: Install the JSON libraries
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y g++-14 ninja-build nlohmann-json3-dev rapidjson-dev \
              libboost-json-dev
          else
            brew install ninja nlohmann-json rapidjson boost
          fi
      # Every paired suite runs over every enabled codec, so this is the job that
      # exercises the new ones at all - the floor matrix builds the default list.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCE_CODECS="nlohmann;rapidjson;boost_json"
          -DCE_WERROR=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  only-boost-json:
    # The mirror of only-rapidjson: Boost.JSON installed and nothing else.
    name: boost_json alone, no other JSON library installed
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build libboost-json-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_STANDARD=20
          -DCE_CODECS=boost_json -DCE_WERROR=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  boost-json-needs-exceptions:
    # Boost requires the PROGRAM to define boost::throw_exception under
    # -fno-exceptions, which is an application's policy and not this SDK's to
    # choose. The combination is refused, and this asserts the refusal rather
    # than trusting a comment.
    name: boost_json refuses -fno-exceptions
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build libboost-json-dev
      - name: Configuring it must fail, naming the option
        run: |
          if cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 \
               -DCE_CODECS=boost_json -DCMAKE_CXX_FLAGS=-fno-exceptions > /tmp/cfg.log 2>&1; then
            echo "boost_json configured with -fno-exceptions; it should not have"
            exit 1
          fi
          grep -q "boost::throw_exception" /tmp/cfg.log || {
            echo "the refusal did not say why; message was:"; cat /tmp/cfg.log; exit 1; }
          echo "refused with the expected explanation"

  only-rapidjson:
    # Installs RapidJSON and NOT nlohmann, which catches a codec header that
    # reaches for another codec's library: on any machine with both, such a
    # header compiles and nothing notices.
    #
    # It does NOT exercise the codec through the suites. json_codec_test and
    # json_format_test still sit behind the nlohmann guard because they hold
    # direct references to nlohmann_codec outside the generated pairs, so this
    # job runs seven tests. all-codecs is what puts rapidjson through the format
    # rules; this job proves the build and the packaging stand without nlohmann.
    name: rapidjson alone, no nlohmann installed
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build rapidjson-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_STANDARD=20
          -DCE_CODECS=rapidjson -DCE_WERROR=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: The nlohmann target must not exist
        run: |
          if grep -q "ce::codec_nlohmann" build/CMakeCache.txt 2>/dev/null; then
            echo "the nlohmann codec target leaked into a rapidjson-only build"
            exit 1
          fi
          echo "no nlohmann target, as asked"
