name: ci

# The build matrix. It depends on the spec gate: a requirement that does not lint,
# does not trace, or whose evidence does not resolve blocks the build rather than
# merging alongside it.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: requirements gate
    uses: ./.github/workflows/spec.yml

  floor:
    name: ${{ matrix.name }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The toolchain floor from SPEC section 8. These are the versions the
          # SDK claims to support, so they are the ones that must be proven; the
          # newer local compilers prove nothing about the floor.
          # GCC 13 is the floor because libstdc++ 13 is the first with <format>.
          - { name: "gcc-13 c++20",   os: ubuntu-24.04, cxx: g++-13,     std: 20, apt: g++-13 }
          - { name: "gcc-13 c++23",   os: ubuntu-24.04, cxx: g++-13,     std: 23, apt: g++-13 }
          # Clang 16 stays in the floor, but only against a library that has
          # <format>. ubuntu-24.04 pairs it with libstdc++ 14; the same compiler on
          # 22.04 (libstdc++ 12) would not build the SDK, which is the point of the
          # #error in detail/config.hpp.
          - { name: "clang-16 c++20", os: ubuntu-24.04, cxx: clang++-16, std: 20, apt: clang-16 }
          - { name: "clang-16 c++23", os: ubuntu-24.04, cxx: clang++-16, std: 23, apt: clang-16 }
          - { name: "appleclang c++20", os: macos-15,   cxx: clang++,    std: 20, apt: "" }
          - { name: "appleclang c++23", os: macos-15,   cxx: clang++,    std: 23, apt: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }} ninja-build
      - name: Install ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}
          -DCMAKE_CXX_STANDARD_REQUIRED=ON
          -DCE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  msvc:
    name: msvc c++20
    needs: gate
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_STANDARD=20 -DCE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  polyfill:
    # ADR-0002. Building the whole suite against the result<T> polyfill on a
    # compiler that HAS std::expected is what enforces the permitted subset: any
    # use of a banned member is a hard compile error here. Removing this job
    # removes the only thing standing between the codebase and a .value() call
    # that breaks the -fno-exceptions guarantee.
    name: forced result<T> polyfill
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_STANDARD=23
          -DCE_WERROR=ON -DCMAKE_CXX_FLAGS=-DCE_FORCE_RESULT_POLYFILL=1
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  no-exceptions:
    name: exceptions disabled
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_STANDARD=20
          -DCE_WERROR=ON -DCMAKE_CXX_FLAGS=-fno-exceptions
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  no-default-codec:
    # SWR-ADOPT-0002 / SWR-JSON-0030: with the codec off, nothing may pull in
    # nlohmann. The build failing to find it is the point.
    name: without the default codec
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_CXX_STANDARD=20
          -DCE_WERROR=ON -DCE_DEFAULT_CODEC=OFF
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  install-consumer:
    # SWR-ADOPT-0004: install the package, then find_package it from a separate
    # project that names no include path of its own.
    name: install and consume
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage" -DCE_BUILD_TESTING=OFF
          cmake --build build --target install
      - name: Consume the installed package
        run: |
          cmake -S test/consumer -B build-consumer -G Ninja \
            -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure

  reflection:
    # SPEC section 3 rule 6 wants early warning from a newer toolchain. GCC's
    # reflection is explicitly experimental and __cpp_impl_reflection tracks a
    # moving paper, so this job is allowed to fail: it surfaces breakage without
    # blocking a release on a feature nobody's floor depends on.
    name: c++26 static reflection (allowed to fail)
    needs: gate
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install a reflection-capable GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-15 || sudo apt-get install -y ninja-build g++-14
      - name: Probe for reflection support
        id: probe
        run: |
          CXX=$(command -v g++-15 || command -v g++-14)
          echo "cxx=$CXX" >> "$GITHUB_OUTPUT"
          if printf 'int main(){}' | $CXX -std=c++2c -freflection -fsyntax-only -x c++ - 2>/dev/null; then
            echo "supported=yes" >> "$GITHUB_OUTPUT"
          else
            echo "supported=no" >> "$GITHUB_OUTPUT"
            echo "::warning::This runner's GCC does not implement -freflection; the C++26 backend was not compiled here."
          fi
      - name: Configure and build
        if: steps.probe.outputs.supported == 'yes'
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=${{ steps.probe.outputs.cxx }} \
            -DCMAKE_CXX_FLAGS="-std=c++2c -freflection" -DCE_WERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure
