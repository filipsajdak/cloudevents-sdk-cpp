name: spec

# The traceability gate. The C++ build jobs depend on this workflow's result, so a
# requirement that does not lint, does not trace, or whose evidence does not resolve
# blocks the build rather than merging alongside it.

on:
  push:
    branches: [main]
  pull_request:
  # Called by ci.yml so the build matrix can depend on this gate's result.
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    name: requirements gate
    runs-on: ubuntu-latest
    # The gates read files, and the delivered_in check reads each release tag once:
    # well under a minute. Anything near this limit is a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The delivered_in check reads every release tag, and a shallow clone has
          # none (SWR-BUILD-0016). The tool fails on a checkout without tags, so a
          # lost fetch-depth turns this job red instead of letting it pass.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gate dependencies
        run: pip install --quiet pyyaml jsonschema

      - name: Lint requirements
        working-directory: spec/tools
        run: python lint_requirements.py

      - name: Check traceability
        working-directory: spec/tools
        run: python check_trace.py --matrix-out "$GITHUB_WORKSPACE/trace_matrix.csv"

      - name: Check reference resolution
        working-directory: spec/tools
        run: python check_references.py

      - name: Check that no delivered requirement is still approved
        working-directory: spec/tools
        run: python derive_delivered_in.py --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-matrix
          path: trace_matrix.csv
          if-no-files-found: ignore
