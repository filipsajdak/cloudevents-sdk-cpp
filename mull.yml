# Mull's settings for scripts/mutation.sh. The script copies this file into the
# build directory and appends the git diff filter, so only the lines a change
# touches are mutated.
mutators:
  - cxx_arithmetic
  - cxx_comparison
  - cxx_boundary
  - cxx_logical
  - cxx_remove_negation
# Library headers only: the suites, the fetched dependencies and the build tree
# are not under test.
includePaths:
  - '.*/include/cloudevents/.*'
excludePaths:
  - '.*/build.*/.*'
  - '.*/_deps/.*'
  - '.*/test/.*'
# Per-mutant limit in milliseconds, on top of ten times the baseline run.
timeout: 10000
